apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Platform services: message brokers and time-series databases.
#
# RabbitMQ is always deployed (required by all pipeline configurations).
#
# To switch MQTT broker:
#   comment out the active broker and uncomment the desired alternative.
#
# To switch time-series DB:
#   comment out the active DB and uncomment the desired alternative.
#
# After editing, commit and push — ArgoCD will reconcile automatically.

resources:
  - rabbitmq-app.yaml

  # MQTT broker — choose one:
  - vernemq-app.yaml      # default
  # - hivemq-app.yaml     # alternative: HiveMQ (requires pathfinder-hivemq image loaded in cluster)

  # Time-series database — choose one:
  - timescaledb-app.yaml  # default
  # - influxdb-app.yaml   # alternative: InfluxDB 3 Core (no Helm chart; uses raw manifests)
