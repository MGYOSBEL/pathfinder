apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: timescaledb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: pathfinder
  sources:
    - chart: timescaledb-single
      repoURL: https://charts.timescale.com
      targetRevision: "*"  # TODO: pin before going to prod
      helm:
        valueFiles:
          - $values/deploy/cluster/base/platform/timescaledb-values.yaml
    - repoURL: https://github.com/MGYOSBEL/pathfinder
      targetRevision: devops/setup-k8s-cluster
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # timescaledb-single installs CRDs
  # The chart hardcodes `role: master` in the Service selector but Patroni
  # labels the primary pod as `role: primary` in newer versions (chart bug).
  # We override via service.primary.spec.selector in values, but ignore the
  # diff here so ArgoCD doesn't loop on the duplicate-key resolution.
  ignoreDifferences:
    - group: ""
      kind: Service
      name: timescaledb
      jsonPointers:
        - /spec/selector
