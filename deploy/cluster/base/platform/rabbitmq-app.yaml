apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: pathfinder
  # Using raw manifests with rabbitmq:4-management (official Docker Hub image).
  # Dropped bitnami/rabbitmq chart: bitnami removed their images from Docker Hub
  # and their own OCI registry is not reachable from kind clusters.
  source:
    repoURL: https://github.com/MGYOSBEL/pathfinder
    targetRevision: devops/setup-k8s-cluster
    path: deploy/cluster/base/platform/rabbitmq
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
