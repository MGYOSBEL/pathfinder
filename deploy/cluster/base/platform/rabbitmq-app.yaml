apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: pathfinder
  sources:
    - chart: rabbitmq
      repoURL: https://charts.bitnami.com/bitnami
      targetRevision: "*"  # TODO: pin before going to prod
      helm:
        valueFiles:
          - $values/deploy/cluster/base/platform/rabbitmq-values.yaml
    - repoURL: https://github.com/MGYOSBEL/pathfinder
      targetRevision: devops/setup-k8s-cluster
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
