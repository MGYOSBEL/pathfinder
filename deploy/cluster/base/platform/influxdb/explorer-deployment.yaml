apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb-explorer
  namespace: platform
  labels:
    app: influxdb-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb-explorer
  template:
    metadata:
      labels:
        app: influxdb-explorer
    spec:
      containers:
        - name: influxdb-explorer
          image: influxdata/influxdb3-ui:1.2.0
          command: ["--mode=admin"]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app-root/config/config.json
              subPath: config.json
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: influxdb-explorer-config
