# timescale/timescaledb-single Helm values
# Docs: https://github.com/timescale/helm-charts/tree/main/charts/timescaledb-single

replicaCount: 1

image:
  repository: timescale/timescaledb-ha
  tag: pg16
  pullPolicy: Always

# Patroni credentials — nested under secrets.credentials, not top-level.
# TODO: replace with secrets.credentialsSecretName pointing to a sealed secret before prod.
secrets:
  credentials:
    PATRONI_SUPERUSER_PASSWORD: postgres
    PATRONI_REPLICATION_PASSWORD: replication
    PATRONI_admin_PASSWORD: admin

# Expose the PostgreSQL port externally via LoadBalancer.
# cloud-provider-kind assigns an IP from 172.21.0.0/16 — reachable directly from the host.
# Expose the PostgreSQL port externally via LoadBalancer.
# cloud-provider-kind assigns an IP from 172.21.0.0/16 — reachable directly from the host.
# service.primary.spec.selector overrides the chart's hardcoded `role: master` selector —
# Patroni now labels the primary pod as `role: primary` (chart bug, not yet fixed upstream).
service:
  primary:
    type: LoadBalancer
    port: 5432
    spec:
      selector:
        app: timescaledb
        cluster-name: timescaledb
        role: primary

persistentVolumes:
  data:
    enabled: true
    size: 5Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

# TimescaleDB tuning — scaled down from Docker config (4GB/4CPU) for homelab.
# timescaledb-tune runs automatically; these env vars control its parameters.
timescaledbTune:
  enabled: true

env:
  - name: TS_TUNE_MEMORY
    value: "1GB"
  - name: TS_TUNE_NUM_CPUS
    value: "2"
  - name: TS_TUNE_MAX_CONNS
    value: "100"
