# timescale/timescaledb-single Helm values
# Docs: https://github.com/timescale/helm-charts/tree/main/charts/timescaledb-single

replicaCount: 1

image:
  repository: timescale/timescaledb-ha
  tag: pg16-latest
  pullPolicy: Always

# Patroni credentials — nested under secrets.credentials, not top-level.
# TODO: replace with secrets.credentialsSecretName pointing to a sealed secret before prod.
secrets:
  credentials:
    PATRONI_SUPERUSER_PASSWORD: postgres
    PATRONI_REPLICATION_PASSWORD: replication
    PATRONI_admin_PASSWORD: admin

persistentVolumes:
  data:
    enabled: true
    size: 5Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

# TimescaleDB tuning — scaled down from Docker config (4GB/4CPU) for homelab.
# timescaledb-tune runs automatically; these env vars control its parameters.
timescaledbTune:
  enabled: true

env:
  - name: TS_TUNE_MEMORY
    value: "1GB"
  - name: TS_TUNE_NUM_CPUS
    value: "2"
  - name: TS_TUNE_MAX_CONNS
    value: "100"
