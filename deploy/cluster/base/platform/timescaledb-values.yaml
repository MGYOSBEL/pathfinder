# timescale/timescaledb-single Helm values
# Docs: https://github.com/timescale/helm-charts/tree/main/charts/timescaledb-single
#
# Note: timescaledb-single uses Patroni internally for HA.
# For homelab, replicaCount: 1 disables HA and runs a plain single-node instance.

clusterName: timescaledb

replicaCount: 1

image:
  repository: timescale/timescaledb
  tag: latest-pg16

# Credentials for the superuser (postgres) account.
# TODO: replace with an ExternalSecret or sealed secret before going to prod.
credentials:
  superuser:
    password: postgres

persistentVolumes:
  data:
    enabled: true
    size: 5Gi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

# TimescaleDB tuning — scaled down from Docker config (4GB/4CPU) for homelab
env:
  - name: TS_TUNE_MEMORY
    value: "1GB"
  - name: TS_TUNE_NUM_CPUS
    value: "2"
  - name: TS_TUNE_MAX_CONNS
    value: "100"
  - name: NO_TS_TUNE
    value: "false"

# Prometheus metrics exporter sidecar
prometheus:
  enabled: true
