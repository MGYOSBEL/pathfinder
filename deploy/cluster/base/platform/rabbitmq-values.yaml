# bitnami/rabbitmq Helm values
# Docs: https://github.com/bitnami/charts/tree/main/bitnami/rabbitmq

# Bitnami stopped publishing images to Docker Hub; all images now live on their
# own OCI registry. Without this override the chart defaults to docker.io and
# the pull fails with "not found".
# allowInsecureImages is required because the chart's NOTES.txt validation
# rejects any registry that isn't in its hardcoded "approved" list — including
# Bitnami's own oci.registry.bitnami.com. See: bitnami/charts#30850
global:
  imageRegistry: oci.registry.bitnami.com
  security:
    allowInsecureImages: true

auth:
  username: admin
  password: admin  # TODO: replace with a Secret reference before going to prod

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Expose the management UI as a ClusterIP service (accessed via HTTPRoute)
service:
  type: ClusterIP

# Prometheus metrics — enable once ServiceMonitor setup is in place
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
