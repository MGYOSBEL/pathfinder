# GatewayClass that binds to the Envoy Gateway controller.
# The controllerName must match the Envoy Gateway Helm chart config
# (config.envoyGateway.gateway.controllerName).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
