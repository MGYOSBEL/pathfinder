apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: networking
spec:
  parentRefs:
    - name: pathfinder
      namespace: networking
      sectionName: https
  hostnames:
    - alertmanager.pathfinder.local
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          namespace: observability
          port: 9093
