apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: networking
spec:
  parentRefs:
    - name: pathfinder
      namespace: networking
      sectionName: https
  hostnames:
    - grafana.pathfinder.local
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          namespace: observability
          port: 80
