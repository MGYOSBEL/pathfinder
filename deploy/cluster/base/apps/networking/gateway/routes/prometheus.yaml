apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: networking
spec:
  parentRefs:
    - name: pathfinder
      namespace: networking
      sectionName: https
  hostnames:
    - prometheus.pathfinder.local
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          namespace: observability
          port: 9090
