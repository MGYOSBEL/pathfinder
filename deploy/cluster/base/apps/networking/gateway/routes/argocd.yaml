# ArgoCD server route.
# ArgoCD is configured with server.insecure=true (HTTP backend).
# The Gateway handles TLS termination and forwards plain HTTP to ArgoCD.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: networking
spec:
  parentRefs:
    - name: pathfinder
      namespace: networking
      sectionName: https
  hostnames:
    - argocd.pathfinder.local
  rules:
    - backendRefs:
        - name: argocd-server
          namespace: argocd
          port: 80
