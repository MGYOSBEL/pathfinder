apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hivemq
  namespace: networking
spec:
  parentRefs:
    - name: pathfinder
      namespace: networking
      sectionName: https
  hostnames:
    - hivemq.pathfinder.local
  rules:
    - backendRefs:
        - name: hivemq
          namespace: platform
          port: 8080
