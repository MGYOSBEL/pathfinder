apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabbitmq
  namespace: networking
spec:
  parentRefs:
    - name: pathfinder
      namespace: networking
      sectionName: https
  hostnames:
    - rabbitmq.pathfinder.local
  rules:
    - backendRefs:
        - name: rabbitmq
          namespace: platform
          port: 15672
