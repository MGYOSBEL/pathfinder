# Jaeger Helm values — all-in-one mode with in-memory storage
# Chart: https://github.com/jaegertracing/helm-charts/tree/main/charts/jaeger
#
# all-in-one packages collector, query, and UI in a single pod.
# In-memory storage is intentional: Tempo is the authoritative trace backend.
# Jaeger here provides the Jaeger UI and receives traces from the OTel Collector.

provisionDataStore:
  cassandra: false
  elasticsearch: false
  kafka: false

# ─────────────────────────────────────────────
# all-in-one deployment
# ─────────────────────────────────────────────
allInOne:
  enabled: true
  image:
    tag: latest

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # in-memory storage — traces are also in Tempo (persistent)
  extraEnv:
    - name: SPAN_STORAGE_TYPE
      value: memory
    - name: MEMORY_MAX_TRACES
      value: "100000"

# Disable separate components — not needed in all-in-one mode
collector:
  enabled: false
query:
  enabled: false
agent:
  enabled: false
ingester:
  enabled: false

storage:
  type: memory
