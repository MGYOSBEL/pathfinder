apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: pathfinder
  sources:
    - chart: envoyproxy/gateway-helm
      repoURL: registry-1.docker.io
      targetRevision: v1.3.0
      helm:
        valueFiles:
          - $values/deploy/cluster/base/apps/networking/envoy-gateway-values.yaml
    - repoURL: https://github.com/MGYOSBEL/pathfinder
      targetRevision: devops/setup-k8s-cluster
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Gateway API CRDs are large
