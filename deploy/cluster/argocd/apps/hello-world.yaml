apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd
spec:
  project: pathfinder
  source:
    repoURL: https://github.com/MGYOSBEL/pathfinder
    targetRevision: devops/setup-k8s-cluster
    path: deploy/cluster/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
