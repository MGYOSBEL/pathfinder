apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: pathfinder
  sources:
    - chart: cert-manager
      repoURL: https://charts.jetstack.io
      targetRevision: "*"  # TODO: pin to a specific version before going to prod
      helm:
        valueFiles:
          - $values/deploy/cluster/base/apps/networking/cert-manager-values.yaml
    - repoURL: https://github.com/MGYOSBEL/pathfinder
      targetRevision: devops/setup-k8s-cluster
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # cert-manager installs many CRDs
