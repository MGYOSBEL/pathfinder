apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pathfinder
  namespace: argocd
spec:
  description: Pathfinder platform project
  sourceRepos:
    - https://github.com/MGYOSBEL/pathfinder
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
