# ArgoCD Helm values for the dev environment
# Secret values (admin password) are injected at bootstrap time from secrets.env
# See: https://artifacthub.io/packages/helm/argo/argo-cd

configs:
  params:
    server.insecure: true   # dev only — skip TLS, ingress handles it

server:
  ingress:
    enabled: false          # no ingress in dev, use port-forward
