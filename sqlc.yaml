version: "2"
sql:
  - engine: "postgresql"
    queries: "./pkg/benthos/processor/topicparser/queries.sql"
    schema: "./db/migrations"
    gen:
      go:
        package: "db"
        out: "./pkg/benthos/processor/topicparser/db"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        sql_package: pgx/v5
